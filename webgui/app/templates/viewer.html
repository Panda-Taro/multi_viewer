<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiViewer 視聴ページ</title>
  <style>
    body { margin: 0; background: #000; color: #ddd; font-family: sans-serif; }
    #video-container { position: relative; width: 100vw; height: 100vh; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #mode-toggle {
      position: absolute; bottom: 16px; right: 16px;
      background: rgba(30,30,30,0.8); color: #fff; border: 1px solid #555;
      padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    #alarm {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(180,20,20,0.85); color: #fff; padding: 8px 16px; border-radius: 4px;
      display: none; font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="whep-video" autoplay playsinline muted></video>
    <button id="mode-toggle">表示モード切替 (4分割⇔シングル)</button>
    <div id="alarm">映像フォーマットが4系統で非統一です</div>
  </div>
  <script src="/mgmt/static/js/viewer.js" data-viewer-path="{{ viewer_path }}"></script>
</body>
</html>
