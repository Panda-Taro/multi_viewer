<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiViewer 視聴</title>
  <link rel="stylesheet" href="/mgmt/static/css/style.css">
</head>
<body>
  <main class="content" style="max-width: 900px; margin: 0 auto;">
    <h1>MultiViewer 視聴画面</h1>
    <div class="panel">
      <p>
        この画面は視聴用URL（{{ config.streaming.url_path }}）のプレースホルダーです。
        WebRTC（WHEP）による実際の映像配信は後続ステップ（MediaMTX連携）で実装されます。
      </p>
      <div class="preview-box" style="max-width: 640px;">
        <div class="preview-quad">
          <div>CH1</div><div>CH2</div><div>CH3</div><div>CH4</div>
        </div>
      </div>
      <p class="help-text">
        表示モード切替はダッシュボードから操作できます（<a href="/mgmt/">/mgmt/</a>）。
      </p>
    </div>
  </main>
</body>
</html>
