<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiViewer 管理画面</title>
  <link rel="stylesheet" href="/mgmt/static/css/style.css">
</head>
<body>
  <div class="layout">
    <nav class="sidenav">
      <div class="brand">MultiViewer</div>
      <a class="{{ 'active' if active_nav == 'dashboard' else '' }}" href="/mgmt/">ダッシュボード</a>
      <a class="{{ 'active' if active_nav == 'media' else '' }}" href="/mgmt/media">メディアストリーム設定</a>
      <a class="{{ 'active' if active_nav == 'ptp_nmos' else '' }}" href="/mgmt/ptp-nmos">PTP・NMOS設定</a>
      <a class="{{ 'active' if active_nav == 'system' else '' }}" href="/mgmt/system">システム設定</a>
      <div class="sidenav-footer">
        <a href="/monitor01/" target="_blank">視聴ページを開く &#8594;</a>
      </div>
    </nav>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
