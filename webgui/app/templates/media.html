{% extends "base.html" %}
{% block content %}
<h1>メディアストリーム設定</h1>
{% if error %}<div class="alert-error">保存に失敗しました: {{ error }} (前の設定を維持しています)</div>{% endif %}

<h2>映像Receiver (4系統)</h2>
{% for v in videos %}
<form class="settings-form" method="post" action="/mgmt/media/video/{{ loop.index0 }}">
  <strong>Video Receiver {{ loop.index }}</strong>
  <label>Source IP</label>
  <input type="text" name="source_ip" value="{{ v.source_ip }}">
  <label>マルチキャストグループ (Amber)</label>
  <input type="text" name="multicast_group_amber" value="{{ v.multicast_group_amber }}">
  <label>マルチキャストグループ (Blue)</label>
  <input type="text" name="multicast_group_blue" value="{{ v.multicast_group_blue }}">
  <label>ポート</label>
  <input type="number" name="port" value="{{ v.port }}">
  <label>ペイロードID</label>
  <input type="number" name="payload_type" value="{{ v.payload_type }}">
  <label>映像フォーマット (NMOS SDPから自動反映されます)</label>
  <input type="text" name="video_format" value="{{ v.video_format }}">
  <label>色形式</label>
  <input type="text" name="pg_format" value="{{ v.pg_format }}">
  <button type="submit">保存</button>
</form>
{% endfor %}

<h2>音声Receiver (1系統, ch1/2のみ使用)</h2>
<form class="settings-form" method="post" action="/mgmt/media/audio">
  <label>Source IP</label>
  <input type="text" name="source_ip" value="{{ audio.source_ip }}">
  <label>マルチキャストグループ (Amber)</label>
  <input type="text" name="multicast_group_amber" value="{{ audio.multicast_group_amber }}">
  <label>マルチキャストグループ (Blue)</label>
  <input type="text" name="multicast_group_blue" value="{{ audio.multicast_group_blue }}">
  <label>ポート</label>
  <input type="number" name="port" value="{{ audio.port }}">
  <label>ペイロードID</label>
  <input type="number" name="payload_type" value="{{ audio.payload_type }}">
  <label>サンプルレート</label>
  <input type="number" name="sample_rate" value="{{ audio.sample_rate }}">
  <label>パケット間隔 (ms)</label>
  <input type="number" step="0.001" name="packet_time_ms" value="{{ audio.packet_time_ms }}">
  <button type="submit">保存</button>
</form>

<h2>PTP設定</h2>
<form class="settings-form" method="post" action="/mgmt/media/ptp">
  <label>ドメイン番号 (0-127)</label>
  <input type="number" name="domain" value="{{ ptp.domain }}">
  <button type="submit">保存</button>
</form>

<h2>NMOS設定</h2>
<form class="settings-form" method="post" action="/mgmt/media/nmos">
  <label>RDS発見モード</label>
  <select name="discovery_mode">
    <option value="mdns" {{ 'selected' if nmos.discovery_mode == 'mdns' }}>mDNS/DNS-SD自動発見</option>
    <option value="static" {{ 'selected' if nmos.discovery_mode == 'static' }}>静的IP/ポート指定</option>
    <option value="p2p" {{ 'selected' if nmos.discovery_mode == 'p2p' }}>P2P (RDS無し)</option>
  </select>
  <label>Registration API アドレス (静的モード時)</label>
  <input type="text" name="registration_address" value="{{ nmos.registration_address }}">
  <label>Registration API ポート (静的モード時)</label>
  <input type="number" name="registration_port" value="{{ nmos.registration_port }}">
  <label>IS-04バージョン</label>
  <select name="is04_version">
    <option value="v1.1" {{ 'selected' if nmos.is04_version == 'v1.1' }}>v1.1</option>
    <option value="v1.2" {{ 'selected' if nmos.is04_version == 'v1.2' }}>v1.2</option>
    <option value="v1.3" {{ 'selected' if nmos.is04_version == 'v1.3' }}>v1.3</option>
  </select>
  <label>IS-05バージョン</label>
  <select name="is05_version">
    <option value="v1.0" {{ 'selected' if nmos.is05_version == 'v1.0' }}>v1.0</option>
    <option value="v1.1" {{ 'selected' if nmos.is05_version == 'v1.1' }}>v1.1</option>
  </select>
  <label>Node API ソースポート ("auto"またはポート番号)</label>
  <input type="text" name="node_api_port" value="{{ nmos.node_api_port }}">
  <label>Registration API ソースポート ("auto"またはポート番号)</label>
  <input type="text" name="registration_api_port" value="{{ nmos.registration_api_port }}">
  <button type="submit">保存</button>
</form>
{% endblock %}
